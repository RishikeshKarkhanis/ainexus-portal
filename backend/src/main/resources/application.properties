
# ==========================================
# APPLICATION
# ==========================================
spring.application.name=${SPRING_APPLICATION_NAME:backend}

# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# HIBERNATE / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# SMTP CONFIGURATION
# ==========================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# ==========================================
# SUPABASE STORAGE
# ==========================================
supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:ainexus-assets}
supabase.storage.payment-bucket=${SUPABASE_PAYMENT_BUCKET:payment-proofs}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
# ==========================================
# FILE UPLOAD
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ==========================================
# ADMIN
# ==========================================
ADMIN_COMMON_PASSWORD=${ADMIN_COMMON_PASSWORD}
MAIL_FROM=${MAIL_FROM}

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.security=INFO


spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=60000